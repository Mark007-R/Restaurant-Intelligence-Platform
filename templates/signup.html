{% extends "base.html" %}
{% block content %}

<style>
  .auth-container {
    max-width: 540px;
    margin: 2rem auto 1rem;
    padding: 0;
  }

  .auth-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    position: relative;
    animation: fadeInUp .6s ease;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .auth-header {
    padding: 2.5rem 2rem 1rem;
    text-align: center;
    position: relative;
  }

  /* the product's single accent -> accent-soft gradient: a hairline on the auth card */
  .auth-header::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--gradient-primary);
  }

  .auth-header h2 {
    font-family: var(--font-display);
    color: var(--ink);
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -.02em;
    margin: 0;
  }

  .auth-header i {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 64px;
    height: 64px;
    margin-bottom: 1rem;
    border-radius: 50%;
    font-size: 1.5rem;
    color: var(--accent);
    background: var(--accent-tint);
    border: 1px solid var(--accent-line);
  }

  .auth-body {
    padding: 1.5rem 2.25rem 2rem;
  }

  .form-group {
    margin-bottom: 1.25rem;
  }

  .form-label {
    margin-bottom: .55rem;
  }

  .role-selector {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .85rem;
    margin-bottom: .5rem;
  }

  .role-option {
    position: relative;
  }

  .role-option input[type="radio"] {
    position: absolute;
    opacity: 0;
  }

  .role-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 1.25rem .9rem;
    text-align: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background var(--ease), border-color var(--ease), box-shadow var(--ease), transform var(--ease);
  }

  .role-label i {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    margin-bottom: .75rem;
    border-radius: 11px;
    font-size: 1.1rem;
    color: var(--ink-3);
    background: var(--card);
    border: 1px solid var(--line);
    transition: color var(--ease), background var(--ease), border-color var(--ease), transform var(--ease);
  }

  .role-label .role-title {
    font-family: var(--font-display);
    color: var(--ink);
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: .2rem;
  }

  .role-label .role-desc {
    color: var(--ink-3);
    font-size: .82rem;
    line-height: 1.5;
  }

  .role-label:hover {
    border-color: var(--accent-line);
    transform: translateY(-2px);
  }

  .role-option input[type="radio"]:checked + .role-label {
    background: var(--accent-tint);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .role-option input[type="radio"]:checked + .role-label i {
    color: var(--on-accent);
    background: var(--accent);
    border-color: var(--accent);
    transform: rotate(-6deg);
  }

  .role-option input[type="radio"]:focus-visible + .role-label {
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .btn-signup {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    width: 100%;
    margin-top: 1.25rem;
    padding: .9rem 1.5rem;
    font-family: var(--font-body);
    font-size: .95rem;
    font-weight: 600;
    color: var(--on-accent);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 999px;
    box-shadow: 0 2px 12px var(--accent-glow);
    cursor: pointer;
    transition: background var(--ease), border-color var(--ease), transform var(--ease), box-shadow var(--ease);
  }

  .btn-signup:hover {
    background: var(--accent-strong);
    border-color: var(--accent-strong);
    transform: translateY(-2px);
    box-shadow: 0 10px 28px var(--accent-glow);
  }

  .btn-signup:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .btn-signup:active {
    transform: translateY(0);
  }

  .auth-footer {
    text-align: center;
    padding: 1.1rem 2rem 1.3rem;
    font-size: .9rem;
    color: var(--ink-3);
    background: var(--bg-alt);
    border-top: 1px solid var(--line);
  }

  .auth-footer a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }

  .auth-footer a:hover {
    color: var(--accent-strong);
    text-decoration: underline;
  }

  .password-toggle {
    position: relative;
  }

  .password-toggle .form-control {
    padding-right: 3rem;
  }

  .password-toggle-btn {
    position: absolute;
    right: .6rem;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    border-radius: 999px;
    color: var(--ink-3);
    cursor: pointer;
    padding: .4rem .55rem;
    line-height: 1;
    transition: color var(--ease), background var(--ease);
  }

  .password-toggle-btn:hover,
  .password-toggle-btn:focus-visible {
    color: var(--accent);
    background: var(--accent-tint);
    outline: none;
  }

  /* strength meter: the bar colour is set inline by checkPasswordStrength() */
  .password-strength {
    height: 4px;
    background: var(--line);
    border-radius: 999px;
    margin-top: .55rem;
    overflow: hidden;
  }

  .password-strength-bar {
    height: 100%;
    width: 0;
    border-radius: 999px;
    transition: width var(--ease), background var(--ease);
  }

  @media (max-width: 480px) {
    .auth-container {
      margin-top: 1rem;
    }

    .auth-body {
      padding: 1.25rem 1.25rem 1.5rem;
    }

    .auth-header h2 {
      font-size: 1.7rem;
    }

    .role-selector {
      grid-template-columns: 1fr;
    }
  }
</style>

<div class="auth-container">
  <div class="auth-card" data-aos="zoom-in">
    <div class="auth-header">
      <i class="fas fa-user-plus"></i>
      <h2>Create Account</h2>
    </div>

    <div class="auth-body">
      <form method="POST" action="{{ url_for('signup') }}" id="signupForm">
        <div class="form-group">
          <label class="form-label" for="username">
            <i class="fas fa-user"></i>
            Username
          </label>
          <input 
            type="text" 
            class="form-control" 
            id="username" 
            name="username" 
            placeholder="Choose a username (min 3 characters)" 
            required
            minlength="3"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="email">
            <i class="fas fa-envelope"></i>
            Email Address
          </label>
          <input 
            type="email" 
            class="form-control" 
            id="email" 
            name="email" 
            placeholder="Enter your email address" 
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fas fa-lock"></i>
            Password
          </label>
          <div class="password-toggle">
            <input 
              type="password" 
              class="form-control" 
              id="password" 
              name="password" 
              placeholder="Create a strong password (min 6 characters)" 
              required
              minlength="6"
              autocomplete="new-password"
              oninput="checkPasswordStrength()"
            >
            <button type="button" class="password-toggle-btn" onclick="togglePassword('password', 'toggleIcon1')">
              <i class="fas fa-eye" id="toggleIcon1"></i>
            </button>
          </div>
          <div class="password-strength">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">
            <i class="fas fa-lock"></i>
            Confirm Password
          </label>
          <div class="password-toggle">
            <input 
              type="password" 
              class="form-control" 
              id="confirm_password" 
              name="confirm_password" 
              placeholder="Re-enter your password" 
              required
              autocomplete="new-password"
            >
            <button type="button" class="password-toggle-btn" onclick="togglePassword('confirm_password', 'toggleIcon2')">
              <i class="fas fa-eye" id="toggleIcon2"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label mb-3">
            <i class="fas fa-user-tag"></i>
            Select Your Role
          </label>
          <div class="role-selector">
            <div class="role-option">
              <input type="radio" name="role" id="role_user" value="user" checked>
              <label for="role_user" class="role-label">
                <i class="fas fa-user"></i>
                <div class="role-title">User</div>
                <div class="role-desc">View and analyze restaurant reviews</div>
              </label>
            </div>

            <div class="role-option">
              <input type="radio" name="role" id="role_manager" value="manager">
              <label for="role_manager" class="role-label">
                <i class="fas fa-user-tie"></i>
                <div class="role-title">Manager</div>
                <div class="role-desc">Full access with management features</div>
              </label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-signup">
          <i class="fas fa-user-plus me-2"></i>
          Sign Up
        </button>
      </form>
    </div>

    <div class="auth-footer">
      Already have an account? 
      <a href="{{ url_for('login') }}">Login here</a>
    </div>
  </div>
</div>

<script>
  function togglePassword(inputId, iconId) {
    const passwordInput = document.getElementById(inputId);
    const toggleIcon = document.getElementById(iconId);

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleIcon.classList.remove('fa-eye');
      toggleIcon.classList.add('fa-eye-slash');
    } else {
      passwordInput.type = 'password';
      toggleIcon.classList.remove('fa-eye-slash');
      toggleIcon.classList.add('fa-eye');
    }
  }

  function checkPasswordStrength() {
    const password = document.getElementById('password').value;
    const strengthBar = document.getElementById('strengthBar');

    let strength = 0;
    if (password.length >= 6) strength += 25;
    if (password.length >= 10) strength += 25;
    if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength += 25;
    if (/[0-9]/.test(password)) strength += 15;
    if (/[^A-Za-z0-9]/.test(password)) strength += 10;

    strengthBar.style.width = strength + '%';

    if (strength < 40) {
      strengthBar.style.background = '#b3261e';
    } else if (strength < 70) {
      strengthBar.style.background = '#a86a12';
    } else {
      strengthBar.style.background = '#3f7a3a';
    }
  }

  document.getElementById('signupForm').addEventListener('submit', function(e) {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirm_password').value;

    if (password !== confirmPassword) {
      e.preventDefault();
      alert('Passwords do not match!');
      return false;
    }
  });
</script>

{% endblock %}
